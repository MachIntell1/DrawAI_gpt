[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machintell-drawing-backend"
version = "2.0.0"
description = "Deterministic ISO/ASME manufacturing drawing planner"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

